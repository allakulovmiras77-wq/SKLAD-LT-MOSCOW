<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1836">
<title>СКЛАД LT МОСКВА</title>
<style>
:root{--bg:#0a1836;--card:#13244d;--card2:#1a2f60;--tx:#eef3ff;--mu:#93a4cc;--ac:#4c8dff;--rd:#ff4d5e;--yl:#ffc933;--gn:#2ecc8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2c427f;background:#0e1d42;min-height:46px}
.b{border:0;border-radius:10px;padding:10px 14px;background:var(--card2);min-height:44px;cursor:pointer;font-weight:600}
.b.p{background:var(--ac)}.b.r{background:var(--rd)}.b.sm{min-height:38px;padding:6px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mu{color:var(--mu);font-size:13px}
header{position:sticky;top:0;z-index:5;background:#081229;padding:10px 14px;border-bottom:1px solid #22366e}
.ttl{font-size:clamp(16px,5vw,22px);font-weight:800;letter-spacing:.5px;line-height:1.1}
.by{font-size:clamp(12px,3.4vw,15px);color:#9fc0ff;font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#0b1a3c}
nav button{white-space:nowrap;border:0;border-radius:20px;padding:9px 14px;background:var(--card);cursor:pointer;font-weight:600}
nav button.on{background:var(--ac)}
main{padding:12px;max-width:900px;margin:auto}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.card.r{border-left:6px solid var(--rd)}.card.y{border-left:6px solid var(--yl)}
.chip{display:inline-block;padding:5px 10px;border-radius:8px;font-weight:700;background:#0e1d42;margin:2px 4px 2px 0}
.chip.r{background:var(--rd);color:#fff}.chip.y{background:var(--yl);color:#222}.chip.g{background:#12503c}
.big{font-size:26px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:18px}
.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bars div i{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-style:normal}
.lbl{display:flex;gap:3px;font-size:10px;color:var(--mu)}.lbl span{flex:1;text-align:center;overflow:hidden}
.hb{height:10px;background:var(--ac);border-radius:5px}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.md{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.md label{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px}
.login{max-width:380px;margin:8vh auto;padding:20px;text-align:center}
.login .ttl{font-size:clamp(24px,8vw,32px)}.login .by{font-size:clamp(15px,4.6vw,19px);margin:6px 0 20px}
.login input{margin-bottom:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:10px;z-index:30;display:none}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,setDoc,updateDoc,deleteDoc,getDoc,getDocs,query,where,orderBy,writeBatch,increment} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== 1. ВСТАВЬТЕ СВОИ ДАННЫЕ ИЗ FIREBASE (Project settings → Your apps → Web) ===== */
const firebaseConfig={apiKey: "AIzaSyCKixbuYcVm1c1-hlMag5_KFfKGzBvMn34",
  authDomain: "sklad-lt-moscow.firebaseapp.com",
  projectId: "sklad-lt-moscow",
  storageBucket: "sklad-lt-moscow.firebasestorage.app",
  messagingSenderId: "924312015041",
  appId: "1:924312015041:web:f3c670f2b87fa07dbd0440",
  measurementId: "G-3HVVXQY4D1"};
/* ===== 2. Email руководителя: кто зарегистрируется с ним, станет администратором ===== */
const ADMIN_EMAIL="lider3@gmail.com";
/* ================================================================================== */

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MP={wb:'Wildberries',ozon:'Ozon'},TY={sale:'Продажа',ret:'Возврат',in:'Приход',set:'Импорт'};
let me=null,prods=[],moves=[],users=[],cfg={red:10,yel:20,target:30},tab='stock',q='',flt='all',per='week',unsubs=[];
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const tm=t=>new Date(t).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const lv=v=>v<cfg.red?'r':v<cfg.yel?'y':'g';
const isAdm=()=>me&&me.role==='admin';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const head=()=>`<div class="ttl">СКЛАД LT МОСКВА</div><div class="by">Created by Miras</div>`;

/* ---------- вход / регистрация ---------- */
function loginView(reg=false,msg=''){
 $('#app').innerHTML=`<div class="login">${head()}
 ${reg?'<input id="nm" placeholder="Ваше имя">':''}<input id="em" type="email" placeholder="Email" autocomplete="username">
 <input id="pw" type="password" placeholder="Пароль (минимум 6 символов)" autocomplete="${reg?'new-password':'current-password'}">
 <button class="b p" style="width:100%" id="go">${reg?'Зарегистрироваться':'Войти'}</button>
 <div style="color:var(--rd);margin:10px 0;min-height:20px">${esc(msg)}</div>
 <button class="b" id="sw" style="width:100%">${reg?'Уже есть аккаунт? Войти':'Регистрация сотрудника'}</button></div>`;
 $('#sw').onclick=()=>loginView(!reg);
 $('#go').onclick=async()=>{
  const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,nm=reg?$('#nm').value.trim():'';
  try{
   if(reg){if(!nm)return loginView(true,'Введите имя');
    window._reg=true;const c=await createUserWithEmailAndPassword(auth,em,pw),a=em===ADMIN_EMAIL.toLowerCase();
    await setDoc(doc(db,'users',c.user.uid),{name:nm,email:em,role:a?'admin':'worker',active:a,created:Date.now()});window._reg=false;boot(c.user)}
   else await signInWithEmailAndPassword(auth,em,pw);
  }catch(e){window._reg=false;loginView(reg,e.code==='auth/email-already-in-use'?'Этот email уже зарегистрирован':e.code==='auth/weak-password'?'Пароль слишком короткий':e.code&&e.code.includes('invalid')?'Неверный email или пароль':e.code==='auth/api-key-not-valid.-please-pass-a-valid-api-key.'?'Не заполнен firebaseConfig':(e.message||'Ошибка'))}
 };
}
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];if(!u){me=null;loginView();return}if(!window._reg)boot(u)});
async function boot(u){
 let s=await getDoc(doc(db,'users',u.uid));
 for(let i=0;i<5&&!s.exists();i++){await new Promise(r=>setTimeout(r,500));s=await getDoc(doc(db,'users',u.uid))}
 if(!s.exists()){await signOut(auth);return}
 me={...s.data(),uid:u.uid};
 if(!me.active){$('#app').innerHTML=`<div class="login">${head()}<div class="card" style="margin-top:20px">Вы зарегистрированы. Дождитесь, пока руководитель подтвердит ваш доступ.</div><button class="b" id="lo">Выйти</button></div>`;$('#lo').onclick=()=>signOut(auth);
  unsubs.push(onSnapshot(doc(db,'users',u.uid),x=>{if(x.exists()&&x.data().active)boot(u)}));return}
 const since=Date.now()-100*864e5,er=e=>toast('Ошибка данных: '+e.code);
 unsubs.push(onSnapshot(collection(db,'products'),x=>{prods=x.docs.map(d=>({...d.data(),id:d.id}));draw()},er));
 unsubs.push(onSnapshot(query(collection(db,'moves'),where('ts','>=',since),orderBy('ts','desc')),x=>{moves=x.docs.map(d=>({...d.data(),id:d.id}));draw()},er));
 unsubs.push(onSnapshot(doc(db,'settings','main'),x=>{if(x.exists())cfg={...cfg,...x.data()};draw()},er));
 if(isAdm())unsubs.push(onSnapshot(collection(db,'users'),x=>{users=x.docs.map(d=>({...d.data(),uid:d.id}));if(tab==='adm')draw()},er));
 draw();
}

/* ---------- каркас ---------- */
function draw(){
 if(!me)return;
 const T=[['stock','📦 Склад'],['send','🚚 Отправить'],['stats','📈 Продажи'],['ret','↩️ Возвраты'],['exp','⬇️ Выгрузка']];if(isAdm())T.push(['adm','⚙️ Управление']);
 const v={stock:vStock,send:vSend,stats:vStats,ret:vRet,exp:vExp,adm:vAdm}[tab]();
 $('#app').innerHTML=`<header><div class="row"><div>${head()}</div><div class="sp"></div><div class="mu" style="text-align:right">${esc(me.name)}<br><a href="#" data-a="out" style="color:var(--ac)">Выйти</a></div></div></header>
 <nav>${T.map(([k,t])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}">${t}</button>`).join('')}</nav><main>${v}</main>`;
 const s=$('#q');if(s)s.oninput=e=>{q=e.target.value;$('#list').innerHTML=listH()};
}

/* ---------- склад ---------- */
function listH(){
 const L=prods.filter(p=>(!q||(p.name+' '+(p.art||'')).toLowerCase().includes(q.toLowerCase()))&&(flt==='all'||(flt==='low'?(p.wb<cfg.yel||p.ozon<cfg.yel):flt==='wb'?p.wb<cfg.yel:p.ozon<cfg.yel))).sort((a,b)=>Math.min(a.wb,a.ozon)-Math.min(b.wb,b.ozon));
 return L.map(p=>{const m=Math.min(p.wb,p.ozon),c=lv(m);return `<div class="card ${c==='g'?'':c}"><div class="row"><b>${esc(p.name)}</b><span class="mu">${esc(p.art||'')}</span><div class="sp"></div>${isAdm()?`<button class="b sm" data-a="edit" data-id="${p.id}">✏️</button>`:''}</div>
 <div><span class="chip ${lv(p.wb)}">WB: ${p.wb}</span><span class="chip ${lv(p.ozon)}">Ozon: ${p.ozon}</span>${c==='r'?'<span class="chip r">ОТПРАВИТЬ!</span>':c==='y'?'<span class="chip y">Скоро кончится</span>':''}</div>
 <div class="row" style="margin-top:6px"><button class="b sm" data-a="mv" data-t="sale" data-id="${p.id}">➖ Продажа</button><button class="b sm" data-a="mv" data-t="ret" data-id="${p.id}">↩️ Возврат</button><button class="b sm" data-a="mv" data-t="in" data-id="${p.id}">➕ Приход</button></div></div>`}).join('')||'<div class="card mu">Товаров нет. Нажмите «+ Товар» или загрузите список в «Управление».</div>';
}
function vStock(){
 const w=prods.reduce((s,p)=>s+p.wb,0),o=prods.reduce((s,p)=>s+p.ozon,0),r=prods.filter(p=>Math.min(p.wb,p.ozon)<cfg.red).length,y=prods.filter(p=>{const m=Math.min(p.wb,p.ozon);return m>=cfg.red&&m<cfg.yel}).length;
 return `<div class="grid"><div class="card"><div class="mu">Wildberries</div><div class="big">${w}</div></div><div class="card"><div class="mu">Ozon</div><div class="big">${o}</div></div><div class="card" style="border-left:6px solid var(--rd)"><div class="mu">Красных</div><div class="big">${r}</div></div><div class="card" style="border-left:6px solid var(--yl)"><div class="mu">Жёлтых</div><div class="big">${y}</div></div></div>
 <div class="row" style="margin-bottom:10px"><input id="q" placeholder="🔍 Поиск по названию или артикулу" value="${esc(q)}" style="flex:1"><button class="b p" data-a="add">+ Товар</button></div>
 <div class="row" style="margin-bottom:10px">${[['all','Все'],['low','Мало'],['wb','Мало на WB'],['ozon','Мало на Ozon']].map(([k,t])=>`<button class="b sm ${flt===k?'p':''}" data-a="flt" data-v="${k}">${t}</button>`).join('')}</div>
 <div id="list">${listH()}</div>`;
}

/* ---------- что отправить ---------- */
function sendList(){const R=[];prods.forEach(p=>['wb','ozon'].forEach(k=>{if(p[k]<cfg.yel)R.push({p,k,n:p[k],need:Math.max(0,cfg.target-p[k])})}));return R.sort((a,b)=>a.n-b.n)}
function vSend(){const R=sendList();
 return `<div class="mu" style="margin-bottom:8px">Красный — меньше ${cfg.red} шт., жёлтый — меньше ${cfg.yel} шт. Норма на маркетплейсе: ${cfg.target} шт.</div><button class="b p" data-a="copy" style="width:100%;margin-bottom:10px">📋 Скопировать список для склада</button>`+
 (R.map(x=>`<div class="card ${lv(x.n)}"><div class="row"><b>${esc(x.p.name)}</b><span class="mu">${esc(x.p.art||'')}</span><div class="sp"></div><span class="chip ${lv(x.n)}">${MP[x.k]}: ${x.n}</span></div><div style="font-weight:700;margin-top:4px">Отправить на ${MP[x.k]}: ${x.need} шт.</div></div>`).join('')||'<div class="card">Всё в порядке — отправлять ничего не нужно ✅</div>');
}

/* ---------- статистика ---------- */
function range(p){const n=new Date(),d=p==='day'?1:p==='week'?7:30;return{d,s:new Date(n.getFullYear(),n.getMonth(),n.getDate()-d+1).getTime()}}
function vStats(){
 const {d,s}=range(per),M=moves.filter(m=>m.ts>=s),S=M.filter(m=>m.type==='sale'),Rt=M.filter(m=>m.type==='ret'),sum=a=>a.reduce((t,x)=>t+x.qty,0);
 const cd=per==='day'?7:d,days=[];for(let i=cd-1;i>=0;i--){const t=new Date();t.setDate(t.getDate()-i);days.push(dk(t))}
 const by={};moves.filter(m=>m.type==='sale').forEach(m=>by[dk(m.ts)]=(by[dk(m.ts)]||0)+m.qty);
 const mx=Math.max(1,...days.map(x=>by[x]||0));
 const top={};S.forEach(m=>top[m.name]=(top[m.name]||0)+m.qty);const T=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,10),tm0=T.length?T[0][1]:1;
 const sw=sum(S.filter(m=>m.mp==='wb')),so=sum(S.filter(m=>m.mp==='ozon')),rs=sum(Rt);
 return `<div class="row" style="margin-bottom:10px">${[['day','День'],['week','Неделя'],['month','Месяц']].map(([k,t])=>`<button class="b ${per===k?'p':''}" data-a="per" data-v="${k}">${t}</button>`).join('')}</div>
 <div class="grid"><div class="card"><div class="mu">Продано</div><div class="big">${sum(S)}</div></div><div class="card"><div class="mu">WB</div><div class="big">${sw}</div></div><div class="card"><div class="mu">Ozon</div><div class="big">${so}</div></div><div class="card"><div class="mu">Возвратов</div><div class="big">${rs}</div><div class="mu">${sum(S)?Math.round(rs/sum(S)*100):0}% от продаж</div></div></div>
 <div class="card"><b>Продажи по дням</b><div class="bars">${days.map(x=>`<div style="height:${(by[x]||0)/mx*100}%"><i>${by[x]||''}</i></div>`).join('')}</div><div class="lbl">${days.map((x,i)=>`<span>${cd>10&&i%5?'':x.slice(8)+'.'+x.slice(5,7)}</span>`).join('')}</div></div>
 <div class="card"><b>Что продаётся лучше всего</b>${T.map(([n,c])=>`<div style="margin-top:8px"><div class="row"><span>${esc(n)}</span><div class="sp"></div><b>${c}</b></div><div class="hb" style="width:${c/tm0*100}%"></div></div>`).join('')||'<div class="mu">Продаж за период нет</div>'}</div>`;
}

/* ---------- возвраты ---------- */
function vRet(){
 const sm=p=>{const {s}=range(p),M=moves.filter(m=>m.ts>=s);return[M.filter(m=>m.type==='ret').reduce((t,x)=>t+x.qty,0),M.filter(m=>m.type==='sale').reduce((t,x)=>t+x.qty,0)]};
 const c=[['Сегодня','day'],['Неделя','week'],['Месяц','month']].map(([t,p])=>{const [r,s]=sm(p);return `<div class="card"><div class="mu">${t}</div><div class="big">${r}</div><div class="mu">${s?Math.round(r/s*100):0}% от продаж</div></div>`}).join('');
 return `<div class="grid">${c}</div><div class="mu" style="margin-bottom:8px">Чтобы записать возврат, нажмите «↩️ Возврат» у товара на вкладке «Склад». Остаток вернётся на маркетплейс.</div>`+
 (moves.filter(m=>m.type==='ret').slice(0,100).map(m=>`<div class="card"><div class="row"><b>${esc(m.name)}</b><div class="sp"></div><span class="chip">${MP[m.mp]}: +${m.qty}</span></div><div class="mu">${tm(m.ts)} · ${esc(m.user)}${m.note?' · '+esc(m.note):''}</div></div>`).join('')||'<div class="card mu">Возвратов пока нет</div>');
}

/* ---------- выгрузка ---------- */
function vExp(){const t=dk(Date.now()),w=dk(Date.now()-6*864e5);
 return `<div class="card"><b>Скачать статистику</b><div class="mu" style="margin:4px 0 8px">Выберите день или период. Для одного дня поставьте одинаковые даты. Файл открывается в Excel.</div>
 <label class="mu">С даты</label><input id="df" type="date" value="${w}"><label class="mu">По дату</label><input id="dt" type="date" value="${t}">
 <label class="mu">Что выгрузить</label><select id="dty"><option value="all">Всё</option><option value="sale">Только продажи</option><option value="ret">Только возвраты</option><option value="in">Только приход</option></select>
 <div class="row" style="margin-top:12px"><button class="b p" data-a="exp" data-v="sum">📊 Сводка по дням и товарам</button><button class="b" data-a="exp" data-v="det">📄 Подробно (каждая операция)</button></div></div>`}
async function doExp(kind){
 const f=$('#df').value,t=$('#dt').value,ty=$('#dty').value;if(!f||!t||f>t)return toast('Проверьте даты');
 const s=new Date(f+'T00:00:00').getTime(),e=new Date(t+'T23:59:59.999').getTime();
 const sn=await getDocs(query(collection(db,'moves'),where('ts','>=',s),where('ts','<=',e),orderBy('ts')));
 const R=sn.docs.map(d=>d.data()).filter(m=>ty==='all'||m.type===ty);if(!R.length)return toast('За этот период данных нет');
 const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let out;
 if(kind==='det'){out=[['Дата','Время','Операция','Маркетплейс','Артикул','Товар','Кол-во','Сотрудник','Примечание']].concat(R.map(m=>{const d=new Date(m.ts);return[dk(m.ts),d.toLocaleTimeString('ru'),TY[m.type],MP[m.mp]||'',m.art,m.name,m.qty,m.user,m.note]}))}
 else{const g={};R.forEach(m=>{const k=dk(m.ts)+'|'+m.name;const o=g[k]||(g[k]={d:dk(m.ts),n:m.name,a:m.art,sw:0,so:0,rw:0,ro:0});const q=m.qty;if(m.type==='sale')m.mp==='wb'?o.sw+=q:o.so+=q;if(m.type==='ret')m.mp==='wb'?o.rw+=q:o.ro+=q});
  out=[['Дата','Артикул','Товар','Продано WB','Продано Ozon','Продано всего','Возврат WB','Возврат Ozon','Возврат всего']].concat(Object.values(g).sort((a,b)=>a.d.localeCompare(b.d)).map(o=>[o.d,o.a,o.n,o.sw,o.so,o.sw+o.so,o.rw,o.ro,o.rw+o.ro]))}
 const blob=new Blob(['\ufeff'+out.map(r=>r.map(c).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=`sklad_${kind==='det'?'podrobno':'svodka'}_${f}_${t}.csv`;a.click();
}

/* ---------- управление ---------- */
function vAdm(){
 return `<div class="card"><b>Сотрудники (${users.filter(u=>u.active).length} из 7 активны)</b>${users.map(u=>`<div class="row" style="margin-top:8px"><div><b>${esc(u.name)}</b> <span class="mu">${u.role==='admin'?'руководитель':'сотрудник'}</span><div class="mu">${esc(u.email)}</div></div><div class="sp"></div>${u.uid===me.uid?'':`<button class="b sm ${u.active?'r':'p'}" data-a="uact" data-id="${u.uid}">${u.active?'Заблокировать':'Подтвердить'}</button>`}</div>`).join('')}</div>
 <div class="card"><b>Пороги</b><label class="mu">Красный, если меньше (шт.)</label><input id="cr" type="number" value="${cfg.red}"><label class="mu">Жёлтый, если меньше (шт.)</label><input id="cy" type="number" value="${cfg.yel}"><label class="mu">Нужный остаток на маркетплейсе (шт.)</label><input id="ct" type="number" value="${cfg.target}"><button class="b p" data-a="cfg" style="margin-top:10px">Сохранить</button></div>
 <div class="card"><b>Загрузить остатки из файла</b><div class="mu" style="margin:4px 0 8px">CSV (Excel → «Сохранить как CSV»). Колонки: Артикул;Название;WB;Ozon. Существующие артикулы обновятся.</div><input id="imp" type="file" accept=".csv,.txt"></div>
 <div class="card"><b>Последние действия</b>${moves.slice(0,30).map(m=>`<div class="mu" style="margin-top:6px">${tm(m.ts)} · ${esc(m.user)} · ${TY[m.type]} ${MP[m.mp]||''} ×${m.qty} · ${esc(m.name)}</div>`).join('')}</div>`;
}
async function importCsv(file){
 const rows=(await file.text()).replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim()).map(l=>l.split(l.includes(';')?';':',').map(x=>x.trim().replace(/^"|"$/g,'')));
 if(rows.length&&isNaN(+rows[0][2]))rows.shift();let b=writeBatch(db),n=0,cnt=0;
 for(const [art,name,wb,oz] of rows){if(!name&&!art)continue;const ex=prods.find(p=>art&&p.art===art),ref=ex?doc(db,'products',ex.id):doc(collection(db,'products'));
  b.set(ref,{art,name:name||art,wb:+wb||0,ozon:+oz||0},{merge:true});n++;cnt++;if(n>=400){await b.commit();b=writeBatch(db);n=0}}
 await b.commit();toast('Загружено позиций: '+cnt);
}

/* ---------- окна ---------- */
function modal(title,body,ok,okText='Готово'){
 const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="md"><h3 style="margin:0">${title}</h3>${body}<div class="row" style="margin-top:14px"><button class="b" data-x>Отмена</button><div class="sp"></div><button class="b p" data-ok>${okText}</button></div></div>`;
 document.body.appendChild(d);d.querySelector('[data-x]').onclick=()=>d.remove();
 d.querySelector('[data-ok]').onclick=async()=>{try{await ok(d);d.remove()}catch(e){toast(e.message||'Ошибка')}};return d;
}
function mvDlg(p,type){
 modal(`${TY[type]}: ${esc(p.name)}`,`<label>Маркетплейс</label><select id="f1"><option value="wb">Wildberries (сейчас ${p.wb})</option><option value="ozon">Ozon (сейчас ${p.ozon})</option></select><label>Количество</label><input id="f2" type="number" min="1" value="1" inputmode="numeric">${type==='ret'?'<label>Причина возврата (необязательно)</label><input id="f3">':''}`,async d=>{
  const mp=d.querySelector('#f1').value,qty=Math.floor(+d.querySelector('#f2').value);if(!(qty>0))throw Error('Введите количество');
  if(type==='sale'&&qty>p[mp]&&!confirm(`На ${MP[mp]} только ${p[mp]} шт. Всё равно записать?`))throw Error('Отменено');
  const b=writeBatch(db);b.update(doc(db,'products',p.id),{[mp]:increment(type==='sale'?-qty:qty)});
  b.set(doc(collection(db,'moves')),{ts:Date.now(),type,mp,pid:p.id,name:p.name,art:p.art||'',qty,note:d.querySelector('#f3')?.value.trim()||'',user:me.name,uid:me.uid});
  await b.commit();toast('Записано ✅');
 });
}
function prodDlg(p){
 modal(p?'Изменить товар':'Новый товар',`<label>Название</label><input id="f1" value="${esc(p?.name)}"><label>Артикул</label><input id="f2" value="${esc(p?.art)}">${p?'':'<label>Остаток WB</label><input id="f3" type="number" value="0"><label>Остаток Ozon</label><input id="f4" type="number" value="0">'}${p?'<button class="b r" id="del" style="margin-top:12px">Удалить товар</button>':''}`,async d=>{
  const name=d.querySelector('#f1').value.trim();if(!name)throw Error('Введите название');const art=d.querySelector('#f2').value.trim();
  if(p)await updateDoc(doc(db,'products',p.id),{name,art});else await setDoc(doc(collection(db,'products')),{name,art,wb:+d.querySelector('#f3').value||0,ozon:+d.querySelector('#f4').value||0});
 }).querySelector('#del')?.addEventListener('click',async e=>{if(confirm('Удалить «'+p.name+'»?')){await deleteDoc(doc(db,'products',p.id));document.querySelector('.ov').remove()}});
}

/* ---------- клики ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();const a=t.dataset.a,v=t.dataset.v,id=t.dataset.id,p=prods.find(x=>x.id===id);
 if(a==='tab'){tab=v;draw()}else if(a==='out')signOut(auth);
 else if(a==='flt'){flt=v;draw()}else if(a==='per'){per=v;draw()}
 else if(a==='mv'&&p)mvDlg(p,t.dataset.t);else if(a==='add')prodDlg();else if(a==='edit'&&p)prodDlg(p);
 else if(a==='exp')doExp(v).catch(er=>toast(er.code==='failed-precondition'?'Нужен индекс Firestore — откройте консоль браузера (F12) и нажмите ссылку':er.message));
 else if(a==='copy'){const tx='ОТПРАВИТЬ НА МАРКЕТПЛЕЙСЫ ('+new Date().toLocaleDateString('ru')+'):\n'+sendList().map(x=>`${x.p.name} ${x.p.art||''} → ${MP[x.k]}: ${x.need} шт. (сейчас ${x.n})`).join('\n');try{await navigator.clipboard.writeText(tx);toast('Скопировано')}catch{toast('Не удалось скопировать')}}
 else if(a==='uact'){const u=users.find(x=>x.uid===id);await updateDoc(doc(db,'users',id),{active:!u.active})}
 else if(a==='cfg'){await setDoc(doc(db,'settings','main'),{red:+$('#cr').value||10,yel:+$('#cy').value||20,target:+$('#ct').value||30});toast('Сохранено')}
});
document.addEventListener('change',e=>{if(e.target.id==='imp'&&e.target.files[0])importCsv(e.target.files[0]).catch(er=>toast(er.message))});
</script></body></html>
